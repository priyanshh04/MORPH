services:
  - type: web
    name: morph
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: LLM_PROVIDER
        value: openai
      - key: MODEL_NAME
        value: gpt-5.5
      - key: MAX_UPLOAD_MB
        value: "12"
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: morph-db
          property: connectionString

databases:
  - name: morph-db
    plan: free
    databaseName: morph
    user: morph
